<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E95555">
  <meta name="description" content="Historial de intervenciones de guardavidas.">
  <title>Historial · Registro Guardavidas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a href="index.html" class="brand" aria-label="Registro Guardavidas - Inicio">
        <span class="brand-icon" aria-hidden="true">+</span>
        <span class="brand-copy">
          <strong>REGISTRO</strong>
          <small>GUARDAVIDAS</small>
        </span>
      </a>

      <div class="header-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>En servicio</span>
      </div>

      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">☰</button>

      <nav class="nav" id="nav" aria-label="Navegación principal">
        <a href="index.html"><span class="nav-icon">⌂</span><span>Inicio</span></a>
        <a href="register.html"><span class="nav-icon">＋</span><span>Registrar</span></a>
        <a href="history.html"><span class="nav-icon">≡</span><span>Historial</span></a>
      </nav>
    </div>
  </header>

  <main class="app-shell history-shell">
    <section class="history-page" aria-labelledby="history-title">
      <div class="history-page-head">
        <a href="index.html" class="back-link">‹ Volver al inicio</a>
        <span class="section-kicker">REGISTROS</span>
        <div class="history-page-title">
          <div>
            <h1 id="history-title">Historial</h1>
            <p>Filtrá las intervenciones por mes, tipo o puesto.</p>
          </div>
          <button class="btn btn-secondary small-btn" id="exportBtn" type="button">Exportar CSV</button>
        </div>
      </div>

      <div class="filters-card">
        <div class="filters">
          <div class="field">
            <label for="filterMonth">Mes</label>
            <input type="month" id="filterMonth">
          </div>

          <div class="field">
            <label for="filterType">Tipo</label>
            <select id="filterType">
              <option value="">Todos</option>
              <option value="Rescate">Rescate</option>
              <option value="Asistencia en agua">Asistencia en agua</option>
              <option value="Asistencia fuera del agua">Asistencia fuera del agua</option>
              <option value="Primeros auxilios">Primeros auxilios</option>
              <option value="Rescate con semirrígido">Rescate con semirrígido</option>
              <option value="Prevención">Prevención</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="field">
            <label for="filterPost">Puesto</label>
            <select id="filterPost">
              <option value="">Todos los puestos</option>
              <option value="Dientudo">1 - Dientudo</option>
              <option value="Dunas">2 - Dunas</option>
              <option value="Eslora">3 - Eslora</option>
              <option value="Gaviotas">4 - Gaviotas</option>
              <option value="Espigón">5 - Espigón</option>
              <option value="Yate">6 - Yate</option>
              <option value="Tamarisco">7 - Tamarisco</option>
              <option value="Piedra Buena">8 - Piedra Buena</option>
              <option value="Legh II">9 - Legh II</option>
              <option value="Puesto Central">10 - Puesto Central</option>
              <option value="Pelícano">11 - Pelícano</option>
              <option value="Asolú">12 - Asolú</option>
              <option value="Rambla">13 - Rambla</option>
              <option value="Peatonal">14 - Peatonal</option>
              <option value="Goleta">15 - Goleta</option>
              <option value="Complejo">16 - Complejo</option>
              <option value="Sorzales">17 - Sorzales</option>
              <option value="Gavilán">18 - Gavilán</option>
              <option value="Villa Caballero">19 - Villa Caballero</option>
            </select>
          </div>
        </div>
      </div>

      <div class="history-list" id="historyList"></div>

      <div class="empty-state" id="emptyState">
        <span class="empty-icon">＋</span>
        <strong>Todavía no hay registros</strong>
        <p>Las intervenciones que cargues van a aparecer acá.</p>
        <a href="register.html" class="empty-link">Registrar intervención</a>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>Registro Guardavidas · Monte Hermoso</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
